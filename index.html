<div id="app"></div>
<noscript><p style="font-family:system-ui;padding:2rem">PRIME WEBS AI kræver JavaScript. Slå det til i din browser.</p></noscript>
<script>window.addEventListener('error',function(e){window.__pwErr=e.message});setTimeout(function(){var a=document.getElementById('app');if(a&&!a.children.length){a.innerHTML='<main style="max-width:560px;margin:10vh auto;padding:1rem;font-family:system-ui,sans-serif"><h1>Dashboardet kunne ikke starte</h1><p>Genindlæs siden (Ctrl+Shift+R, på mobil: træk ned). Hvis det fortsætter, så prøv en nyere browser.</p><p style="color:#C0263A">'+String(window.__pwErr||'Ukendt fejl').replace(/</g,'&lt;')+'</p></main>'}},3000)</script>
<script src="app.js"></script>
</body>
